services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cybercrime
      POSTGRES_PASSWORD: cybercrime
      POSTGRES_DB: cybercrime
    ports:
      - "5432:5432"
    volumes:
      - cybercrime-db-data:/var/lib/postgresql/data

volumes:
  cybercrime-db-data:
